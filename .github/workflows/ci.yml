name: Check build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  codespell:
    name: Run codespell
    runs-on: ubuntu-26.04

    steps:
      - name: Run codespell
        uses: codespell-project/actions-codespell@v2

  run-tests:
    name: Run tests
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rust-src

      - name: Add problem matchers
        run: echo "::add-matcher::.github/rust.json"

      - name: Run tests
        run: cargo test --all-targets --features client,fastrand,server,sha1_smol

  run-fuzzer:
    name: Run fuzzer
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rust-src

      - name: Install cargo-fuzz
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-fuzz
          locked: false

      - name: Run stream fuzzer for a limited time
        run: |
          RUST_BACKTRACE=1 cargo fuzz run stream -- -max_total_time=900

  build-docs:
    name: Build docs
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rust-src

      - name: Add problem matchers
        run: echo "::add-matcher::.github/rust.json"

      - name: Build docs
        env:
          RUSTDOCFLAGS: --cfg docsrs
        run: cargo doc --no-deps --all-features

  clippy:
    name: Clippy

    strategy:
      matrix: &hosted-platforms
        include:
          - arch: aarch64
            image: ubuntu-26.04-arm
          - arch: x86_64
            image: ubuntu-26.04

    runs-on: ${{ matrix.image }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rust-src,clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Add problem matchers
        run: echo "::add-matcher::.github/rust.json"

      - name: Run clippy
        run: cargo clippy --all-features --all-targets

      - name: Run clippy (fuzz)
        run: cargo clippy --manifest-path fuzz/Cargo.toml --all-targets

  cross-compile:
    name: Cross-compile (${{ matrix.target }})
    runs-on: ubuntu-26.04

    strategy:
      matrix:
        target:
          - loongarch64-unknown-linux-gnu
          - powerpc64le-unknown-linux-gnu
          - s390x-unknown-linux-gnu

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install nightly toolchain and target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          targets: ${{ matrix.target }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Check pure Rust library for target
        run: cargo check --lib --target "${{ matrix.target }}" --no-default-features --features client,fastrand,nightly,server,sha1_smol

  rustfmt:
    name: Format
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rustfmt

      - name: Add problem matchers
        run: echo "::add-matcher::.github/rust.json"

      - name: Run cargo fmt
        run: cargo fmt -- --check

      - name: Run cargo fmt (fuzzer)
        run: cargo fmt --manifest-path fuzz/Cargo.toml -- --check

  min-vers:
    name: Minimal crate versions
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rust-src

      - name: Install cargo-hack
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-hack
          locked: false

      - name: Install cargo-minimal-versions
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-minimal-versions
          locked: false

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Add problem matchers
        run: echo "::add-matcher::.github/rust.json"

      - name: Check minimal versions
        run: cargo minimal-versions check

  features:
    name: Feature powerset (nightly)
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rust-src

      - name: Install cargo-hack
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-hack
          locked: false

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Add problem matchers
        run: echo "::add-matcher::.github/rust.json"

      - name: Check powerset
        run: |
          cargo hack check \
            --feature-powerset \
            --no-dev-deps \
            --exclude-features aws_lc_rs,rustls-tls12 \
            --group-features client,nightly,sha1_smol \
            --group-features server,sha1_smol

  miri:
    name: Run tests in miri

    strategy:
      matrix: *hosted-platforms

    runs-on: ${{ matrix.image }}

    steps:
      # Helpful for debugging and making sure our runners support the
      # vector instructions we emit
      - name: Show CPU information
        run: lscpu

      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: miri, rust-src

      - name: Run tests in miri
        run: |
          cargo miri test --examples --tests --features client,fastrand,server,sha1_smol

  msrv:
    name: Feature powerset (MSRV)

    strategy:
      matrix: *hosted-platforms

    runs-on: ${{ matrix.image }}

    steps:
      # Helpful for debugging and making sure our runners support the
      # vector instructions we emit
      - name: Show CPU information
        run: lscpu

      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Retrieve rust-version
        run: echo rust-version=$(awk '/rust-version/{print $NF}' Cargo.toml | tr -d '"') >> $GITHUB_ENV

      - name: Install toolchain (${{ env.rust-version }})
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.rust-version }}

      - name: Install cargo-hack
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-hack
          locked: false

      - name: Get latest compatible dependencies for MSRV
        run: CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS=fallback cargo update

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Add problem matchers
        run: echo "::add-matcher::.github/rust.json"

      - name: Check powerset (${{ matrix.arch }})
        run: |
          cargo hack check \
            --feature-powerset \
            --no-dev-deps \
            --exclude-features rustls-tls12,nightly \
            --group-features client,fastrand,sha1_smol \
            --group-features server,sha1_smol

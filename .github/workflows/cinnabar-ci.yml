name: Cinnabar CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo check --lib --no-default-features --locked
      - run: cargo test --all-targets --features client,fastrand,server,sha1_smol --locked
      - run: cargo clippy --all-targets --features client,fastrand,server,sha1_smol --locked -- -D warnings
